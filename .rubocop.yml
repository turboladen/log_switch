inherit_from: .rubocop_todo.yml

AllCops:
  # Any RuboCop upgrade would otherwise activate cops that are absent from
  # .rubocop_todo.yml and turn `rake test` red on an unrelated change.
  NewCops: disable
  SuggestExtensions: false

# Policy, not debt: RSpec `describe` bodies are long by construction, so this
# is never going to be "paid off".
#
# `inherit_mode` is required, not decoration: a bare `Exclude:` REPLACES
# RuboCop's default Exclude for this cop (`**/*.gemspec`) rather than adding to
# it, which silently un-excludes the gemspec and makes its
# `Gem::Specification.new` block a live offense. Merging keeps the default.
Metrics/BlockLength:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/**/*'

# The three cops below restate RuboCop's own defaults. They look redundant and
# are not: `--auto-gen-config` "resolves" a cop by writing an `EnforcedStyle`
# into .rubocop_todo.yml that INVERTS the project's style for new code, and
# `--auto-gen-only-exclude` does NOT prevent that (verified: it still emits
# hash_rockets / use_perl_names / no_space / brackets). The todo is the inherited
# parent, so restating the default in this child overrides any inversion and a
# regeneration cannot reverse it.
#
# Nothing inverts on today's tree, but only by accident: RuboCop skips the
# inversion when a cop sees at least one correctly-styled instance
# (`correct_style_detected`), and the survivors are incidental -- `{ two: 2 }` in
# an array spec, `task test:` in the Rakefile, two `$LOAD_PATH` uses. Delete that
# spec and the protection evaporates silently. These four lines make it
# structural instead.
Style/HashSyntax:
  EnforcedStyle: ruby19

Style/SpecialGlobalVars:
  EnforcedStyle: use_english_names

# This one also carries an Exclude, and that Exclude is debt, not policy --
# the one deliberate exception to the split. `lib/log_switch.rb` is byte-identical
# to the published 1.0 API and stays that way, so its offense is excluded rather
# than fixed. It lives here and not in the todo because a regenerated todo drops
# its own exclusion, the offense goes live, and `rake rubocop:autocorrect_all`
# (which RuboCop::RakeTask exposes) would rewrite lib/.
#
# Tracked as the lib-cosmetic-style follow-up. DELETE the Exclude when that
# lands, or the cop silently stops guarding lib/ forever.
Layout/SpaceAroundEqualsInParameterDefault:
  EnforcedStyle: space
  Exclude:
    - 'lib/log_switch.rb'
